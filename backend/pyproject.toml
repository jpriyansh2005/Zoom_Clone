[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# A WebSocket test that waits for a message that never comes would hang forever.
timeout = 30

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear, UP: modern syntax
select = ["E", "W", "F", "I", "B", "UP"]
# FastAPI's Depends(...) in argument defaults is the framework's intended usage.
ignore = ["B008"]
